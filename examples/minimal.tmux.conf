# tmux-tiling-revamped: minimal configuration
#
# Add to your ~/.tmux.conf after installing via TPM.

# Install the plugin
set -g @plugin 'tmux-revamped/tmux-tiling-revamped'

# That's it. Default keybindings:
#   prefix + M-D - Apply dwindle layout
#   prefix + M-S - Apply spiral layout
#   prefix + M-V - Apply main-vertical layout
#   prefix + M-H - Apply main-horizontal layout
#   prefix + M-B - Balance panes
#   prefix + M-E - Equalize panes
#   prefix + M-M - Promote focused pane to master
#   prefix + M-R - Rotate layout 90 degrees
#   prefix + M-F - Flip layout horizontally
#   prefix + M-C - Circulate panes
#   prefix + M-A - Smart split (autotile)
#   prefix + M-O - Cycle to next layout
#   prefix + M-G - Grow master pane
#   prefix + M-X - Shrink master pane
#   prefix + M-Y - Toggle synchronize panes
#   prefix + M-K - Mark pane (prompts for name)
#   prefix + M-J - Jump to marked pane
#   prefix + M-T - Toggle scratchpad popup
