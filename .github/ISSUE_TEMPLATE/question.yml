name: Question
description: Ask a usage question
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Before asking, please check this plugin's README and its existing issues.

  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried?

  - type: textarea
    id: doctor
    attributes:
      label: doctor output
      description: >-
        The whole output of the plugin's doctor command, such as `cpu-revamped doctor`.
        On a release without the command, paste the output of `tmux -V` and `uname -sm` instead.
      render: text
