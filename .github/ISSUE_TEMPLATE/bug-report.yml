name: Bug Report
description: Report a bug in this plugin
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Run the plugin's `doctor` and `version` commands in the shell where the bug happens
        and paste their whole output below. `doctor` lists tmux, gum and every tool the plugin
        uses, each with its path and version, so the report says which tools ran.

  - type: textarea
    id: doctor
    attributes:
      label: doctor output
      description: >-
        The whole output of the plugin's doctor command, such as `cpu-revamped doctor`.
        On a release without the command, paste the output of `tmux -V` and `uname -sm` instead.
      render: text
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: version output
      description: >-
        The whole output of the plugin's version command, such as `cpu-revamped version`.
        On a release without the command, paste the plugin's tag or commit instead.
      render: text
    validations:
      required: true

  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - macOS, Apple Silicon
        - macOS, Intel
        - Linux, x86-64
        - Linux, arm64
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal emulator
      placeholder: "Ghostty, iTerm2, Alacritty, Kitty, etc."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant tmux.conf
      description: The lines of your tmux.conf that configure this plugin
      render: tmux
