name: PR Automation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  size:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Label PR by size
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          lines=$(git diff --stat "origin/${BASE_REF}...${HEAD_SHA}" | tail -1 \
            | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' || echo "0")

          if (( lines < 100 )); then
            label="size/S"
          elif (( lines < 400 )); then
            label="size/M"
          elif (( lines < 1000 )); then
            label="size/L"
          else
            label="size/XL"
          fi

          gh pr edit "$PR_NUMBER" --add-label "$label" || true

  commit-grammar:
    runs-on: ubuntu-26.04
    steps:
      - name: Validate the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .{1,}$'
          if ! echo "$TITLE" | grep -qE "$pattern"; then
            echo "FAIL: the title is not a conventional commit"
            echo "Got: $TITLE"
            exit 1
          fi
          if (( ${#TITLE} > 50 )); then
            echo "FAIL: the title is ${#TITLE} characters, the limit is 50"
            echo "Got: $TITLE"
            exit 1
          fi
