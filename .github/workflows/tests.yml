name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-ubuntu-lts:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.lts.outputs.version }}
    steps:
      - name: Query the current Ubuntu LTS
        id: lts
        run: |
          version=$(curl -fsSL https://changelogs.ubuntu.com/meta-release \
            | grep -B1 'LTS' | grep -oP '^Version: \K[\d.]+' | tail -1 | cut -d. -f1,2)
          echo "Latest Ubuntu LTS: ${version:-unresolved}"
          echo "version=${version:-24.04}" >> "$GITHUB_OUTPUT"

  test-linux:
    needs: [resolve-ubuntu-lts]
    name: test-linux (${{ matrix.host }}, ${{ matrix.tools }})
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-26.04, ubuntu-26.04-arm]
        tools: [uutils, gnu]
    runs-on: ${{ matrix.host }}
    container:
      image: ubuntu:${{ needs.resolve-ubuntu-lts.outputs.version }}
    env:
      TOOLS: ${{ matrix.tools }}
    steps:
      - name: Bootstrap the container
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git make bats tmux zsh ca-certificates
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Select the core tools
        shell: bash
        run: |
          if [[ "${TOOLS}" == "gnu" ]]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --allow-remove-essential \
              coreutils-from-gnu coreutils-from-uutils-
          else
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --allow-remove-essential \
              coreutils-from-uutils coreutils-from-gnu-
          fi
          echo "SHELL=$(command -v zsh)" >> "$GITHUB_ENV"

      - name: Verify the profile
        shell: bash
        run: |
          bash --version | head -1
          zsh --version
          tmux -V
          cat --version | head -1
          expected="GNU coreutils"
          [[ "${TOOLS}" == "uutils" ]] && expected="uutils coreutils"
          cat --version | head -1 | grep -qF "${expected}"
          [[ "${SHELL}" == */zsh ]]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run tests
        run: make test

  test-macos:
    name: test-macos (${{ matrix.os }}, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
        profile: [system, gnu, uutils]
    runs-on: ${{ matrix.os }}
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          packages=(bats-core tmux)
          case "${PROFILE}" in
            gnu) packages+=(bash zsh coreutils findutils diffutils gnu-sed grep gawk) ;;
            uutils) packages+=(bash zsh uutils-coreutils uutils-findutils uutils-diffutils gnu-sed grep gawk) ;;
          esac
          brew install "${packages[@]}"

      - name: Select the shells and core tools
        run: |
          prefix="$(brew --prefix)"
          text_tools=("$(brew --prefix gawk)/libexec/gnubin" "$(brew --prefix grep)/libexec/gnubin"
            "$(brew --prefix gnu-sed)/libexec/gnubin")
          case "${PROFILE}" in
            system)
              paths=(/usr/sbin /sbin /usr/bin /bin)
              login_shell=/bin/zsh
              ;;
            gnu)
              paths=("${prefix}/bin" "${text_tools[@]}" "$(brew --prefix diffutils)/bin"
                "$(brew --prefix findutils)/libexec/gnubin" "$(brew --prefix coreutils)/libexec/gnubin")
              login_shell="${prefix}/bin/zsh"
              ;;
            uutils)
              paths=("${prefix}/bin" "${text_tools[@]}" "$(brew --prefix uutils-diffutils)/libexec/uubin"
                "$(brew --prefix uutils-findutils)/libexec/uubin" "$(brew --prefix uutils-coreutils)/libexec/uubin")
              login_shell="${prefix}/bin/zsh"
              ;;
          esac
          for dir in "${paths[@]}"; do
            echo "${dir}" >> "$GITHUB_PATH"
          done
          echo "SHELL=${login_shell}" >> "$GITHUB_ENV"

      - name: Verify the profile
        run: |
          command -v bash
          bash --version | head -1
          "${SHELL}" --version
          tmux -V
          case "${PROFILE}" in
            system)
              [[ "$(command -v bash)" == /bin/bash && "${SHELL}" == /bin/zsh ]]
              if cat --version >/dev/null 2>&1; then exit 1; fi
              ;;
            gnu)
              [[ "$(command -v bash)" == "$(brew --prefix)/bin/bash" && "${SHELL}" == "$(brew --prefix)/bin/zsh" ]]
              cat --version | head -1 | grep -qF "GNU coreutils"
              sed --version | head -1 | grep -qF "GNU sed"
              ;;
            uutils)
              [[ "$(command -v bash)" == "$(brew --prefix)/bin/bash" && "${SHELL}" == "$(brew --prefix)/bin/zsh" ]]
              cat --version | head -1 | grep -qF "uutils coreutils"
              sed --version | head -1 | grep -qF "GNU sed"
              ;;
          esac

      - name: Run tests
        run: make test

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Run shellcheck
        run: make lint

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - name: Check shebang lines
        run: |
          fail=0
          while IFS= read -r f; do
            head -1 "$f" | grep -q '^#!/usr/bin/env bash' || { echo "FAIL: $f missing shebang"; fail=1; }
          done < <(find src -name "*.sh" | sort)
          exit $fail

      - name: Check source guards are reset between tests
        run: |
          guards=$(grep -rhoE '^_[A-Z_]+_LOADED=1' src/ | sed 's/=1$//' | sort -u)
          if [[ -z "$guards" ]]; then exit 0; fi
          unsets=$(grep -rhoE 'unset _[A-Z_]+_LOADED' test/ | sed 's/^unset //' | sort -u)
          missing=$(comm -23 <(echo "$guards") <(echo "$unsets"))
          if [[ -n "$missing" ]]; then
            echo "Source guards never unset in the test helpers:"
            echo "$missing"
            exit 1
          fi

      - name: Check file sizes
        run: |
          fail=0
          allow=.github/file-size-allowlist
          while IFS= read -r f; do
            lines=$(wc -l < "$f")
            max=500
            if [[ -f "$allow" ]]; then
              entry=$(grep -E "^${f}[[:space:]]" "$allow" || true)
              if [[ -n "$entry" ]]; then max=$(echo "$entry" | awk '{print $2}'); fi
            fi
            if (( lines > max )); then
              echo "FAIL: $f has $lines lines (max $max)"
              fail=1
            fi
          done < <(find src -name "*.sh" | sort)
          exit $fail

      - name: Check every option appears in the docs
        run: |
          slug=$(basename "$PWD" | sed 's/^tmux-//; s/-revamped$//')
          fail=0
          while IFS= read -r opt; do
            if ! grep -qF -- "$opt" README.md; then
              echo "FAIL: $opt is not documented in README.md"
              fail=1
            fi
          done < <(grep -rhoE "@${slug}_revamped_[a-z_]+" src/ | sort -u)
          exit $fail

  coverage:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats tmux python3

      - name: Build and install kcov
        run: |
          sudo apt-get install -y -qq cmake binutils-dev libcurl4-openssl-dev \
            libdw-dev libiberty-dev zlib1g-dev libssl-dev g++
          git clone --depth 1 https://github.com/SimonKagstrom/kcov.git /tmp/kcov
          cmake -S /tmp/kcov -B /tmp/kcov/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/kcov/build -j"$(nproc)"
          sudo cmake --install /tmp/kcov/build

      - name: Measure coverage and enforce threshold
        run: make coverage

  version:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check version consistency
        run: |
          src_ver=$(grep -hoE '[A-Z_]+VERSION="[0-9.]+"' src/lib/utils/constants.sh | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          cl_ver=$(grep -m1 -E '^## \[[0-9]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          readme_ver=$(grep -oE 'version-[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1 | sed 's/version-//')
          echo "constants=$src_ver changelog=$cl_ver readme=$readme_ver"
          if [[ -z "$src_ver" ]]; then echo "FAIL: no version constant in constants.sh"; exit 1; fi
          if [[ "$src_ver" != "$cl_ver" ]]; then
            echo "FAIL: constants ($src_ver) != CHANGELOG ($cl_ver)"; exit 1
          fi
          if [[ -n "$readme_ver" && "$src_ver" != "$readme_ver" ]]; then
            echo "FAIL: constants ($src_ver) != README badge ($readme_ver)"; exit 1
          fi

  release:
    needs: [test-linux, test-macos, lint, coverage, version]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine version
        id: version
        run: |
          current_ver=$(grep -hoE '[A-Z_]+VERSION="[0-9.]+"' src/lib/utils/constants.sh | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "current_ver=${current_ver}" >> "$GITHUB_OUTPUT"
          if git tag -l "v${current_ver}" | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "v${current_ver} already tagged, skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog
        if: steps.version.outputs.skip == 'false'
        env:
          VER: ${{ steps.version.outputs.current_ver }}
        run: |
          ver="${VER}"
          awk "/^## \[${ver}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > /tmp/release-notes.md

      - name: Create release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.version.outputs.current_ver }}
        run: |
          ver="${VER}"
          repo="${GITHUB_REPOSITORY##*/}"
          mkdir -p /tmp/release-staging
          cp -r src README.md CHANGELOG.md LICENSE /tmp/release-staging/
          cp ./*.tmux /tmp/release-staging/ 2>/dev/null || true
          tar czf "${repo}-${ver}.tar.gz" -C /tmp/release-staging .
          gh release create "v${ver}" --target "${GITHUB_SHA}" --title "v${ver}" --notes-file /tmp/release-notes.md "${repo}-${ver}.tar.gz"
