name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-ubuntu-lts:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.lts.outputs.version }}
    steps:
      - name: Query the current Ubuntu LTS
        id: lts
        run: |
          version=$(curl -fsSL https://changelogs.ubuntu.com/meta-release \
            | grep -B1 'LTS' | grep -oP '^Version: \K[\d.]+' | tail -1 | cut -d. -f1,2)
          echo "Latest Ubuntu LTS: ${version:-unresolved}"
          echo "version=${version:-24.04}" >> "$GITHUB_OUTPUT"

  test-linux:
    needs: [resolve-ubuntu-lts]
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.host }}
    container:
      image: ubuntu:${{ needs.resolve-ubuntu-lts.outputs.version }}
    steps:
      - name: Bootstrap the container
        run: |
          apt-get update -qq
          apt-get install -y -qq git make bats tmux ca-certificates
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run tests
        run: make test

  test-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: brew install bats-core tmux

      - name: Run tests
        run: make test

  test-macos-gnu:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install tmux, bats, and GNU tools
        run: brew install bats-core tmux coreutils gawk gnu-sed grep

      - name: Run tests with GNU tools on PATH
        run: |
          gnubin="$(brew --prefix coreutils)/libexec/gnubin"
          gnubin="${gnubin}:$(brew --prefix gnu-sed)/libexec/gnubin"
          gnubin="${gnubin}:$(brew --prefix grep)/libexec/gnubin"
          gnubin="${gnubin}:$(brew --prefix gawk)/libexec/gnubin"
          export PATH="${gnubin}:${PATH}"
          awk --version | head -1
          sed --version | head -1
          make test

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Run shellcheck
        run: make lint

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - name: Check shebang lines
        run: |
          fail=0
          while IFS= read -r f; do
            head -1 "$f" | grep -q '^#!/usr/bin/env bash' || { echo "FAIL: $f missing shebang"; fail=1; }
          done < <(find src -name "*.sh" | sort)
          exit $fail

      - name: Check source guards are reset between tests
        run: |
          guards=$(grep -rhoE '^_[A-Z_]+_LOADED=1' src/ | sed 's/=1$//' | sort -u)
          if [[ -z "$guards" ]]; then exit 0; fi
          unsets=$(grep -rhoE 'unset _[A-Z_]+_LOADED' test/ | sed 's/^unset //' | sort -u)
          missing=$(comm -23 <(echo "$guards") <(echo "$unsets"))
          if [[ -n "$missing" ]]; then
            echo "Source guards never unset in the test helpers:"
            echo "$missing"
            exit 1
          fi

      - name: Check file sizes
        run: |
          fail=0
          allow=.github/file-size-allowlist
          while IFS= read -r f; do
            lines=$(wc -l < "$f")
            max=500
            if [[ -f "$allow" ]]; then
              entry=$(grep -E "^${f}[[:space:]]" "$allow" || true)
              if [[ -n "$entry" ]]; then max=$(echo "$entry" | awk '{print $2}'); fi
            fi
            if (( lines > max )); then
              echo "FAIL: $f has $lines lines (max $max)"
              fail=1
            fi
          done < <(find src -name "*.sh" | sort)
          exit $fail

      - name: Check every option appears in the docs
        run: |
          slug=$(basename "$PWD" | sed 's/^tmux-//; s/-revamped$//')
          while IFS= read -r opt; do
            grep -q -- "$opt" README.md 2>/dev/null || echo "WARN: $opt is not documented in README.md"
          done < <(grep -rhoE "@${slug}_revamped_[a-z_]+" src/ | sort -u)

  coverage:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats tmux python3

      - name: Build and install kcov
        run: |
          sudo apt-get install -y -qq cmake binutils-dev libcurl4-openssl-dev \
            libdw-dev libiberty-dev zlib1g-dev libssl-dev g++
          git clone --depth 1 https://github.com/SimonKagstrom/kcov.git /tmp/kcov
          cmake -S /tmp/kcov -B /tmp/kcov/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/kcov/build -j"$(nproc)"
          sudo cmake --install /tmp/kcov/build

      - name: Measure coverage and enforce threshold
        run: make coverage

  version:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check version consistency
        run: |
          src_ver=$(grep -hoE '[A-Z_]+VERSION="[0-9.]+"' src/lib/utils/constants.sh | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          cl_ver=$(grep -m1 -E '^## \[[0-9]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          readme_ver=$(grep -oE 'version-[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1 | sed 's/version-//')
          echo "constants=$src_ver changelog=$cl_ver readme=$readme_ver"
          if [[ -z "$src_ver" ]]; then echo "FAIL: no version constant in constants.sh"; exit 1; fi
          if [[ "$src_ver" != "$cl_ver" ]]; then
            echo "FAIL: constants ($src_ver) != CHANGELOG ($cl_ver)"; exit 1
          fi
          if [[ -n "$readme_ver" && "$src_ver" != "$readme_ver" ]]; then
            echo "FAIL: constants ($src_ver) != README badge ($readme_ver)"; exit 1
          fi

  release:
    needs: [test-linux, test-macos, test-macos-gnu, lint, coverage, version]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine version
        id: version
        run: |
          current_ver=$(grep -hoE '[A-Z_]+VERSION="[0-9.]+"' src/lib/utils/constants.sh | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "current_ver=${current_ver}" >> "$GITHUB_OUTPUT"
          if git tag -l "v${current_ver}" | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "v${current_ver} already tagged, skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog
        if: steps.version.outputs.skip == 'false'
        env:
          VER: ${{ steps.version.outputs.current_ver }}
        run: |
          ver="${VER}"
          awk "/^## \[${ver}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > /tmp/release-notes.md

      - name: Create release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.version.outputs.current_ver }}
        run: |
          ver="${VER}"
          repo="${GITHUB_REPOSITORY##*/}"
          mkdir -p /tmp/release-staging
          cp -r src README.md CHANGELOG.md LICENSE /tmp/release-staging/
          cp ./*.tmux /tmp/release-staging/ 2>/dev/null || true
          tar czf "${repo}-${ver}.tar.gz" -C /tmp/release-staging .
          gh release create "v${ver}" --target "${GITHUB_SHA}" --title "v${ver}" --notes-file /tmp/release-notes.md "${repo}-${ver}.tar.gz"
