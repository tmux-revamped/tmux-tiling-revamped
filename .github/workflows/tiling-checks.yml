name: Tiling checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tiling-checks-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  plugin-specific:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check constants exhaustiveness
        run: |
          fail=0
          while IFS= read -r opt; do
            if ! grep -qF -- "$opt" src/lib/utils/constants.sh; then
              echo "FAIL: $opt used in source but not in constants.sh"
              fail=1
            fi
          done < <(grep -rh '@tiling_revamped_' src/lib/ | grep -vE '^[[:space:]]*#' \
            | grep -oE '@tiling_revamped_[a-z_]*' | sort -u)
          exit "$fail"

      - name: Check ASCII art width consistency
        shell: python3 {0}
        run: |
          import glob
          import sys

          box = {chr(code) for code in range(0x2500, 0x2580)}
          failed = False
          for path in sorted(glob.glob("src/lib/layouts/*.sh")):
              with open(path, encoding="utf-8") as handle:
                  widths = {len(line.rstrip("\n")) for line in handle if line[:1] in box}
              if len(widths) > 1:
                  print(f"FAIL: inconsistent line widths in {path}: {sorted(widths)}")
                  failed = True
          sys.exit(1 if failed else 0)

      - name: Check README-to-code sync
        run: |
          fail=0
          for cmd in balance equalize rotate flip promote circulate autosplit focus-resize resize-master sync swap cycle pick undo workspace move-to-workspace project swap-pick validate info doctor restore-layouts help; do
            if ! grep -qE "tiling\.sh ${cmd}( |$)|\`${cmd}[\` ]" README.md; then
              echo "FAIL: command '$cmd' not found in README"
              fail=1
            fi
          done
          exit "$fail"

      - name: Check help text sync
        run: |
          fail=0
          while IFS= read -r cmd; do
            if ! grep -qE "^    ${cmd}\)" src/tiling.sh; then
              echo "FAIL: help lists '$cmd' but the dispatcher has no case for it"
              fail=1
            fi
          done < <(sed -n '/^  layout /,/^HELP$/p' src/tiling.sh | grep -oE '^[[:space:]]+[^[:space:]]+' | tr -d ' ' | sort -u)
          exit "$fail"
